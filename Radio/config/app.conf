AppName = openvpn-ui
HttpPort = 8080
# L'ecoute publique est protegee par nftables AVANT le demarrage du service.
RadioVpnNetwork = "@VPN_NETWORK@"
RadioPublicIP = "@PUBLIC_IP@"
RadioPKIOrganization = "@PKI_ORG@"
RadioPKIEmail = "@PKI_EMAIL@"
# RunMode = dev
RunMode = prod
EnableGzip = true
# EnableAdmin = true
EnableAdmin = false
SessionOn = true
CopyRequestBody = true
DbPath = "./db/data.db"
AuthType = "password"
; LdapAddress = "localhost:389"
; LdapDn = "cn=%s,ou=users,dc=syncloud,dc=org"
; plain/tls/starttls
; LdapTransport = "plain"
; LdapInsecureSkipVerify = true
;EasyRsaPath = "/usr/share/easy-rsa"
# EasyRsaPath = "./easy-rsa"
EasyRsaPath = "/usr/share/easy-rsa"
# OpenVpnPath = "./openvpn"
OpenVpnPath = "/etc/openvpn"
# OpenVpnManagementAddress = "openvpn:2080"
OpenVpnManagementAddress = "127.0.0.1:2080"
OpenVpnManagementNetwork = "tcp"
